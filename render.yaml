# Render blueprint: "New > Blueprint" in the Render dashboard, pointed at this repository.
services:
  - type: web
    name: friday-ap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Render asks for these values; they are never stored in the repository. Fill in one key.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FRIDAY_AI_PROVIDER   # anthropic or gemini; empty picks whichever has a key
        sync: false
      - key: FRIDAY_MODEL         # empty uses the provider's default model
        sync: false
